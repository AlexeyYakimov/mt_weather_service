services:
  weather-api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # All outbound HTTP(S) goes through the socks-bridge sidecar.
      HTTP_PROXY: http://socks-bridge:8080
      HTTPS_PROXY: http://socks-bridge:8080
      NO_PROXY: localhost,127.0.0.1
    depends_on:
      - socks-bridge
    ports:
      - "8000:8000"
    volumes:
      - weather-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # HTTP proxy -> upstream SOCKS5. Set SOCKS_PROXY=socks5://user:pass@host:port in .env
  socks-bridge:
    image: gogost/gost:3.3.2
    restart: unless-stopped
    command: ["-L", "http://:8080", "-F", "${SOCKS_PROXY:?set SOCKS_PROXY in .env}"]

volumes:
  weather-data:
